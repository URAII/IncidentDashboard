name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  readiness-check:
    name: Readiness Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Readiness Gate
        run: npm run check

  google-sheet-staging-smoke:
    name: Google Sheet Staging Smoke (Protected)
    runs-on: ubuntu-latest
    needs:
      - readiness-check
    env:
      GOOGLE_SHEETS_STAGING_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_STAGING_SPREADSHEET_ID }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Prepare Google Credentials (Protected)
        shell: bash
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "Protected credentials secret not present; smoke command will use skip path."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/secure"
          CRED_FILE="$RUNNER_TEMP/secure/google-staging-service-account.json"
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$CRED_FILE"
          chmod 600 "$CRED_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED_FILE" >> "$GITHUB_ENV"

      - name: Run Protected Google Sheet Staging Smoke
        run: npm run smoke:google-sheet:staging
