name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  readiness-check:
    name: Readiness Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify unzip Availability
        run: |
          which unzip
          unzip -v | head -n 2

      - name: Install Dependencies
        run: npm ci

      - name: Run Readiness Gate
        run: npm run check

  google-sheet-staging-smoke:
    name: Google Sheet Staging Smoke (Protected)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - readiness-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Protected Staging Config
        id: config
        shell: bash
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SHEETS_STAGING_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_STAGING_SPREADSHEET_ID }}
        run: |
          missing=()
          if [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]; then
            missing+=("GCP_WORKLOAD_IDENTITY_PROVIDER")
          fi
          if [ -z "$GCP_SERVICE_ACCOUNT_EMAIL" ]; then
            missing+=("GCP_SERVICE_ACCOUNT_EMAIL")
          fi
          if [ -z "$GOOGLE_SHEETS_STAGING_SPREADSHEET_ID" ]; then
            missing+=("GOOGLE_SHEETS_STAGING_SPREADSHEET_ID")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Protected staging smoke skipped: missing required secret(s)=$(IFS=,; echo "${missing[*]}"), status=skip"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - id: auth
        if: steps.config.outputs.should_run == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Run Protected Google Sheet Staging Smoke
        if: steps.config.outputs.should_run == 'true'
        env:
          GOOGLE_SHEETS_STAGING_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_STAGING_SPREADSHEET_ID }}
        run: npm run smoke:google-sheet:staging
